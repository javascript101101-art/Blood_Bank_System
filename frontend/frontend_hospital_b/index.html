<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ဆေးရုံ A - သွေးဘဏ် စီမံခန့်ခွဲမှုစနစ်</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Separate CSS file နှင့် ချိတ်ဆက်ခြင်း -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-animated min-h-screen flex items-center justify-center p-4 relative">

  <!-- Cool Background Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Main Login Card Container -->
  <div class="relative z-10 w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl shadow-[0_30px_80px_rgba(0,0,0,0.6)] overflow-hidden border border-white/30 p-8 sm:p-10 transition-all duration-300 hover:shadow-[0_30px_100px_rgba(0,0,0,0.8)]">
    
    <!-- Logo & Header Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-rose-50/80 text-rose-600 text-3xl shadow-inner mb-4 border border-rose-200/50">
        🩸
      </div>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">ဆေးရုံ (B) သွေးဘဏ်</h1>
      <p class="text-slate-500 text-xs sm:text-sm mt-1 font-medium">စီမံခန့်ခွဲမှုစနစ်သို့ အကောင့်ဝင်ရန်</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-5">

      <!-- Username Input -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 ml-1">အသုံးပြုသူအမည်</label>
        <div class="relative group">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 group-focus-within:text-rose-500 transition-colors duration-200">👤</span>
          <input type="text" id="username" required placeholder="သင့်အသုံးပြုသူအမည် ထည့်ပါ" 
                 class="w-full pl-11 pr-4 py-3.5 bg-slate-50/90 border border-slate-200/80 rounded-2xl focus:outline-none focus:ring-4 focus:ring-rose-500/30 focus:border-rose-500 focus:bg-white text-slate-800 text-sm transition-all duration-200 placeholder:text-slate-400/70 shadow-sm">
        </div>
      </div>

      <!-- Password Input -->
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 ml-1">စကားဝှက်</label>
        <div class="relative group">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 group-focus-within:text-rose-500 transition-colors duration-200">🔑</span>
          <input type="password" id="password" required placeholder="စကားဝှက်ကို ထည့်ပါ" 
                 class="w-full pl-11 pr-4 py-3.5 bg-slate-50/90 border border-slate-200/80 rounded-2xl focus:outline-none focus:ring-4 focus:ring-rose-500/30 focus:border-rose-500 focus:bg-white text-slate-800 text-sm transition-all duration-200 placeholder:text-slate-400/70 shadow-sm">
        </div>
      </div>

      <!-- Error / Success Message Box -->
      <div id="loginError" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 text-center text-xs font-medium transition-all duration-300"></div>

      <!-- Submit Button -->
      <button type="submit" 
              class="shine-btn relative w-full bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-700 hover:to-rose-800 text-white font-bold py-3.5 rounded-2xl transition-all duration-300 shadow-lg shadow-rose-600/40 hover:shadow-rose-600/60 text-sm flex items-center justify-center gap-2 transform active:scale-[0.97] hover:scale-[1.02]">
        <span>🔐</span> အကောင့်ဝင်မည်
      </button>

      <!-- Register Account Link -->
      <div class="text-center pt-4 text-slate-500 text-xs border-t border-slate-200/60 mt-2">
        အကောင့်မရှိသေးဘူးလား? 
        <a href="register.html" class="text-rose-600 font-bold hover:text-rose-700 hover:underline ml-1 transition-colors">အသစ်စာရင်းသွင်းရန်</a>
      </div>

    </form>
  </div>

  <!-- JS SCRIPTS -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
