<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital A - Donor Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🩸 Hospital A</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="active">📊 Dashboard</a>
            <a href="donors.html">👤 Donors</a>
            <a href="inventory.html">📦 Inventory</a>
            <a href="requests.html">📋 Requests</a>
            <a href="global_request.html">🌐 Global Request</a>  <!-- 🆕 -->
            <a href="#" id="logoutBtn">🚪 Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1>Donor Management</h1>
            <button class="btn btn-primary" id="addDonorBtn">+ Add Donor</button>
        </div>

        <div class="card">
            <div class="card-body">
                <table id="donorsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>DOB</th>
                            <th>Blood Group</th>
                            <th>Rh Factor</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="donorsBody">
                        <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Donor Modal -->
    <div id="donorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Donor</h2>
                <span class="close">&times;</span>
            </div>
            <form id="donorForm">
                <input type="hidden" id="donorId">
                <div class="form-group">
                    <label for="donorName">Name *</label>
                    <input type="text" id="donorName" required>
                </div>
                <div class="form-group">
                    <label for="donorDob">Date of Birth</label>
                    <input type="date" id="donorDob">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="donorBloodGroup">Blood Group *</label>
                        <select id="donorBloodGroup" required>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="AB">AB</option>
                            <option value="O">O</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="donorRhFactor">Rh Factor *</label>
                        <select id="donorRhFactor" required>
                            <option value="Positive">Positive</option>
                            <option value="Negative">Negative</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="donorPhone">Phone</label>
                    <input type="text" id="donorPhone" placeholder="09xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label for="donorEmail">Email</label>
                    <input type="email" id="donorEmail" placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="donorLastDonation">Last Donation Date</label>
                    <input type="date" id="donorLastDonation">
                </div>
                <!-- 🆕 Donation Quantity Field - REQUIRED -->
                <div class="form-group">
                    <label for="donorQuantity">Donation Quantity (ml) *</label>
                    <input type="number" id="donorQuantity" min="100" max="600" required placeholder="Enter quantity (100-600ml)">
                    <small style="color: #888;">Min: 100ml, Max: 600ml</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save Donor</button>
                <div id="donorFormError" class="error-message" style="display:none;"></div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/donors.js"></script>
</body>
</html>
