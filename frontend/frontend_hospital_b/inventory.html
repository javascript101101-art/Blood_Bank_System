<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital A - Inventory Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🩸 Hospital A</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="donors.html">👤 Donors</a>
            <a href="inventory.html" class="active">📦 Inventory</a>
            <a href="requests.html">📋 Requests</a>
            <a href="global_request.html">🌐 Global Request</a>  <!-- 🆕 -->
            <a href="#" id="logoutBtn">🚪 Logout</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <h1>📦 Inventory Management</h1>
            <button class="btn btn-primary" id="addInventoryBtn">+ Add Inventory</button>
        </div>

        <!-- Inventory Table -->
        <div class="card">
            <div class="card-body">
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th>Blood Group</th>
                            <th>Rh Factor</th>
                            <th>Quantity (ml)</th>
                            <th>Expiry Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody">
                        <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Inventory Modal -->
    <div id="inventoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Inventory</h2>
                <span class="close">&times;</span>
            </div>
            <form id="inventoryForm">
                <input type="hidden" id="inventoryId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="invBloodGroup">Blood Group *</label>
                        <select id="invBloodGroup" required>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="AB">AB</option>
                            <option value="O">O</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="invRhFactor">Rh Factor *</label>
                        <select id="invRhFactor" required>
                            <option value="Positive">Positive</option>
                            <option value="Negative">Negative</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="invQuantity">Quantity (ml) *</label>
                    <input type="number" id="invQuantity" min="0" required placeholder="Enter quantity in ml">
                </div>
                <div class="form-group">
                    <label for="invExpiryDate">Expiry Date *</label>
                    <input type="date" id="invExpiryDate" required>
                </div>
                <div class="form-group">
                    <label for="invStatus">Status</label>
                    <select id="invStatus">
                        <option value="Available">Available</option>
                        <option value="Expired">Expired</option>
                        <option value="Quarantined">Quarantined</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save Inventory</button>
                <div id="inventoryFormError" class="error-message" style="display:none;"></div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
