<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Admin Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat bg-fixed min-h-screen flex items-center justify-center relative p-4" 
      style="background-image: url('https://plus.unsplash.com/premium_photo-1764691482392-92b36f7d597c?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8aG9zcGl0YWwlMjBsYWJvcmF0b3J5fGVufDB8fDB8fHww');">

  <!-- Background Overlay -->
  <div class="absolute inset-0 bg-slate-900/60"></div>

  <div class="relative z-10 w-full max-w-md bg-white/95 rounded-2xl shadow-2xl overflow-hidden my-auto border border-white/20">
    <div class="login-container">
        <div class="login-box">
            
            <div class="bg-slate-800 text-white p-6 text-center">
                <h1 class="text-xl font-bold flex justify-center items-center gap-2 mb-1">
                  <span>🌐</span> Global Admin
                </h1>
                <p class="text-slate-300 text-xs sm:text-sm">Blood Bank Management System - Central Dashboard</p>
            </div>

            <form id="loginForm" class="p-6 sm:p-8 space-y-5 text-sm">
                
                <!-- Username Input -->
                <div class="form-group">
                    <label for="username" class="block font-semibold text-slate-700 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required
                           class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-600 bg-slate-50 text-slate-800 transition">
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password" class="block font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required
                           class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-600 bg-slate-50 text-slate-800 transition">
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" 
                            class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-slate-800/20 text-sm flex items-center justify-center gap-2">
                        <span>🔐</span> Login
                    </button>
                </div>

                <!-- Error Message Box -->
                <div id="loginError" class="error-message p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-center font-semibold text-xs" style="display:none;"></div>

            </form>

        </div>
    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
