<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Admin Login</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 🟢 Login Page အတွက် သီးသန့် CSS ဖိုင် -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-animated p-4 relative">
    
    <div class="login-container relative z-10">
        <div class="login-box">
            
            <!-- Header -->
            <div class="login-header">
                <h1>
                  <span>🌐</span> Global Admin
                </h1>
                <p>Blood Bank Management System - Central Dashboard</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="text-sm">
                
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    <span>🔐</span> Login
                </button>

                <!-- Error Message -->
                <div id="loginError" class="error-message" style="display:none;"></div>

            </form>

        </div>
    </div>

    <!-- 🟢 JavaScript Files (မူရင်းအတိုင်း) -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
