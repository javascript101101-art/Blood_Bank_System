<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Admin - Global Blood Requests</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🌐 Global Admin</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="donors.html">👤 All Donors</a>
            <a href="inventory.html">📦 All Inventory</a>

    <div class="main-content">
        <div class="top-bar">
            <h1>🌐 Global Blood Requests Management</h1>
        </div>

        <div class="card">
            <div class="card-body">
                <table id="requestsTable">
                    <thead>

                            <th>Rh Factor</th>

                            <th>Assigned To</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestsBody">
                        <tr><td colspan="8">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
