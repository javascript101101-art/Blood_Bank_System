<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Admin - ချိတ်ဆက်မှုမှတ်တမ်းများ</title>
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Global Admin Base CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Sync Logs အတွက် သီးသန့်ခွဲထုတ်ထားသော CSS -->
    <link rel="stylesheet" href="css/sync_logs.css">
</head>
<body class="bg-animated">
    
<!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-globe" style="color: var(--medical-cyan);"></i> Central Hub</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"><i class="fas fa-chart-pie"></i> ပင်မစာမျက်နှာ</a>
            <a href="donors.html"><i class="fas fa-users"></i> သွေးလှူရှင်အားလုံး</a>
            <a href="inventory.html"><i class="fas fa-boxes"></i> သွေးလက်ကျန်အားလုံး</a>
            <!-- 🟢 requests.html ကို အသစ်ထည့်သွင်းထားပါသည် -->
            <a href="requests.html" ><i class="fas fa-clipboard-list"></i> သွေးတောင်းခံလွှာအားလုံး</a>
            <a href="global_requests.html"><i class="fas fa-globe-asia"></i> ကမ္ဘာ့သွေးတောင်းခံမှုများ</a>
            <a href="sync_logs.html"><i class="fas fa-history"></i> ချိတ်ဆက်မှုမှတ်တမ်းများ</a>
            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> ထွက်ရန်</a>
        </nav>
    </div>
    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <!-- 🟢 Top Bar Title + User Info ကို ကျန်တဲ့ Page တွေလို ထည့်ပေးထားပါတယ် -->
            <h1><i class="fas fa-history" style="color: var(--medical-cyan); margin-right: 10px;"></i> ချိတ်ဆက်မှုမှတ်တမ်းများ</h1>
            <div style="display: flex; align-items: center; gap: 16px;">
                <button class="btn btn-primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> ပြန်လည်ဆွဲယူရန်</button>
                <div class="user-info">
                    <div class="user-avatar"><i class="fas fa-user-shield"></i></div>
                    <div>
                        <span id="userName">Global Admin</span>
                        <span class="badge" id="userRole">GLOBAL_ADMIN</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sync Logs Table -->
        <div class="card">
            <div class="card-body">
                <table id="syncLogsTable">
                    <thead>
                        <tr>
                            <th>အချိန်တံဆိပ်</th>
                            <th>ထပ်တူပြုသည့် ID</th>
                            <th>အခြေအနေ</th>
                            <th>အမှားအယွန်း သတင်းစကား</th>
                        </tr>
                    </thead>
                    <tbody id="syncLogsBody">
                        <tr><td colspan="4" class="text-center text-muted" style="color: var(--text-muted);">ဒေတာ ရယူနေသည်...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JS Scripts (မူရင်းအတိုင်း) -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync_logs.js"></script>

    <!-- 🟢 UI Only Script: User Name ကို "User" ဟု ပြောင်းလဲပေးခြင်း -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                const userNameEl = document.getElementById('userName');
                if (userNameEl) {
                    userNameEl.textContent = 'User'; 
                }
            }, 100);
        });
    </script>
</body>
</html>
