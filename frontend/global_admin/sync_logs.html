<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Admin - Sync Logs</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🌐 Global Admin</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="active">📊 Dashboard</a>
            <a href="donors.html">👤 All Donors</a>
            <a href="inventory.html">📦 All Inventory</a>
            <a href="requests.html">📋 All Requests</a>
            <a href="global_requests.html" class="active">🌐 Global Requests</a>  <!-- 🆕 -->
            <a href="sync_logs.html">📋 Sync Logs</a>
            <a href="#" id="logoutBtn">🚪 Logout</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <h1>📋 Sync Logs</h1>
            <button class="btn btn-primary" id="refreshBtn">🔄 Refresh</button>
        </div>

        <!-- Sync Logs Table -->
        <div class="card">
            <div class="card-body">
                <table id="syncLogsTable">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Sync Queue ID</th>
                            <th>Status</th>
                            <th>Error Message</th>
                        </tr>
                    </thead>
                    <tbody id="syncLogsBody">
                        <tr><td colspan="4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sync_logs.js"></script>
</body>
</html>
