<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital A - Blood Request Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🩸 Hospital A</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="donors.html">👤 Donors</a>
            <a href="inventory.html">📦 Inventory</a>
            <a href="requests.html" class="active">📋 Requests</a>
            <a href="global_request.html">🌐 Global Request</a>
            <a href="#" id="logoutBtn">🚪 Logout</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <h1>📋 Blood Request Management</h1>
            <button class="btn btn-primary" id="addRequestBtn">+ New Request</button>
        </div>

        <!-- Request Table -->
        <div class="card">
            <div class="card-body">
                <table id="requestsTable">
                    <thead>
                        <tr>
                            <!-- 🟢 Table Header များကို အသစ်ပြောင်းထားပါသည် -->
                            <th>Clinic Name</th>
                            <th>Blood Group</th>
                            <th>Required Date</th>
                            <th>Quantity (Units)</th>
                            <th>Urgency</th>
                            <th>Status</th>
                            <th>Requested At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestsBody">
                        <tr><td colspan="8">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Request Modal -->
    <div id="requestModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">New Blood Request</h2>
                <span class="close">&times;</span>
            </div>
            <form id="requestForm">
                <input type="hidden" id="requestId">
                
                <h4 style="margin-bottom: 10px; color: #555;">🏥 CLINIC / HOSPITAL INFORMATION</h4>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="reqClinicName">Clinic Name *</label>
                        <input type="text" id="reqClinicName" required placeholder="e.g. City Health Clinic">
                    </div>
                    <div class="form-group">
                        <label for="reqLicense">License *</label>
                        <input type="text" id="reqLicense" required placeholder="e.g. REG-102938">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reqContactPhone">Contact Phone *</label>
                        <input type="text" id="reqContactPhone" required placeholder="09xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label for="reqContactEmail">Contact Email *</label>
                        <input type="email" id="reqContactEmail" required placeholder="clinic@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reqClinicAddress">Clinic Address *</label>
                    <input type="text" id="reqClinicAddress" required placeholder="Street, Township, City">
                </div>

                <h4 style="margin-bottom: 10px; margin-top: 20px; color: #555;">🩸 BLOOD REQUEST DETAILS</h4>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reqBloodGroup">Blood Group *</label>
                        <select id="reqBloodGroup" required>
                            <option value="">Select Blood Group</option>
                            <option value="A Positive">A Positive</option>
                            <option value="A Negative">A Negative</option>
                            <option value="B Positive">B Positive</option>
                            <option value="B Negative">B Negative</option>
                            <option value="AB Positive">AB Positive</option>
                            <option value="AB Negative">AB Negative</option>
                            <option value="O Positive">O Positive</option>
                            <option value="O Negative">O Negative</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reqQuantity">Quantity (Units) *</label>
                        <input type="number" id="reqQuantity" min="1" required placeholder="e.g. 2">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reqUrgency">Urgency Level *</label>
                        <select id="reqUrgency" required>
                            <option value="Normal Request">Normal Request</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reqRequiredDate">Required Date *</label>
                        <input type="date" id="reqRequiredDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reqPatientCondition">Patient Condition / Reason</label>
                    <textarea id="reqPatientCondition" rows="3" placeholder="Brief explanation of patient condition or requirement..."></textarea>
                </div>

                <!-- ★★★ Admin အတွက် Status Dropdown (Staff Account ဆိုရင် js ကနေ ဖျောက်ပေးဖို့လိုမယ်) ★★★ -->
                <div class="form-group" id="statusGroup">
                    <label for="reqStatus">Status</label>
                    <select id="reqStatus">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Fulfilled">Fulfilled</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Submit Blood Request</button>
                <div id="requestFormError" class="error-message" style="display:none;"></div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/requests.js"></script>
</body>
</html>
