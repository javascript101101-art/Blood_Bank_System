<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital A - Global Blood Request</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🩸 Hospital A</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="active">📊 Dashboard</a>
            <!-- 🟢 Staff များအတွက် ဖြုတ်နိုင်ရန် ID ထည့်ထားပါသည် -->
            <a href="donors.html" id="navDonors">👤 Donors</a>
            <a href="inventory.html">📦 Inventory</a>
            <a href="requests.html">📋 Requests</a>
            <a href="global_request.html">🌐 Global Request</a>
            <a href="#" id="logoutBtn">🚪 Logout</a>
        </nav>
    </div>


    <div class="main-content">
        <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>🌐 Request Blood from Global</h1>
            <!-- 🆕 Global ဆီမှ Data လှမ်းဆွဲမည့် Sync ခလုတ် -->
            <button onclick="syncFromGlobal()" class="btn btn-secondary" style="background-color: #17a2b8; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">
                🔄 Sync / Pull from Global
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="globalRequestForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="reqBloodGroup">Blood Group *</label>
                            <select id="reqBloodGroup" required>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="AB">AB</option>
                                <option value="O">O</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="reqRhFactor">Rh Factor *</label>
                            <select id="reqRhFactor" required>
                                <option value="Positive">Positive</option>
                                <option value="Negative">Negative</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reqQuantity">Quantity Required (ml) *</label>
                        <input type="number" id="reqQuantity" min="1" required placeholder="Enter quantity in ml">
                    </div>
                    <div class="form-group">
                        <label for="reqUrgency">Urgency</label>
                        <select id="reqUrgency">
                            <option value="Normal">Normal</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reqNote">Request Note</label>
                        <textarea id="reqNote" rows="3" placeholder="Additional notes..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Send Request to Global</button>
                    <div id="formError" class="error-message" style="display:none;"></div>
                </form>
            </div>
        </div>

        <!-- My Requests -->
        <div class="card">
            <div class="card-header">
                <h3>📋 My Global Requests</h3>
            </div>
            <div class="card-body">
                <table id="requestsTable">
                    <thead>
                        <tr>
                            <th>Blood Group</th>
                            <th>Rh Factor</th>
                            <th>Quantity</th>
                            <th>Urgency</th>
                            <th>Status</th>
                            <th>Assigned To</th>
                            <th>Requested At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestsBody">
                        <tr><td colspan="8">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/global_request.js"></script>
</body>
</html>
