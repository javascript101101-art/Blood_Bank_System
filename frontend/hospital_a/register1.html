<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital A - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Form အသစ်အတွက် ပိုမိုသပ်ရပ်စေရန် အနည်းငယ် ဖြည့်စွက်ထားပါသည် */
        .section-title { margin: 20px 0 10px 0; color: #444; font-size: 1.1em; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box" style="max-width: 500px;"> <!-- Form ကြီးသွားသဖြင့် Size ချဲ့ပေးထားသည် -->
            <div class="register-header">
                <h1>🩸 Hospital A</h1>
                <!-- 🟢 ခေါင်းစဉ်ကို Clinic အတွက် သီးသန့် ပြောင်းထားပါသည် -->
                <p>Create Clinic Account</p>
            </div>
            <form id="registerForm">
                
                <h3 class="section-title">👤 User Information</h3>
                
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="full_name">Full Name *</label>
                    <input type="text" id="full_name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="Enter password (min 6 chars)" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" placeholder="Confirm password" required>
                </div>
                <div class="form-group">
                    <label for="role">Role *</label>
                    <!-- 🟢 Role နေရာတွင် Clinic တစ်ခုတည်းသာ ထားရှိပါသည် -->
                    <select id="role" required>
                        <option value="Clinic">External Clinic</option>
                    </select>
                </div>

                <!-- 🆕 အသစ် ထပ်ပေါင်းထည့်ထားသော Clinic Information နေရာ -->
                <h3 class="section-title">🏥 Clinic / Hospital Information</h3>
                
                <div class="form-group">
                    <label for="regClinicName">Clinic Name *</label>
                    <input type="text" id="regClinicName" required placeholder="e.g. City Health Clinic">
                </div>
                <div class="form-group">
                    <label for="regLicense">License *</label>
                    <input type="text" id="regLicense" required placeholder="e.g. REG-12345">
                </div>
                <div class="form-group">
                    <label for="regContactPhone">Contact Phone *</label>
                    <input type="text" id="regContactPhone" required placeholder="09xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label for="regContactEmail">Contact Email *</label>
                    <input type="email" id="regContactEmail" required placeholder="clinic@example.com">
                </div>
                <div class="form-group">
                    <label for="regClinicAddress">Clinic Address *</label>
                    <textarea id="regClinicAddress" rows="2" required placeholder="Enter full address"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Register</button>
                <div id="registerError" class="error-message" style="display:none; color:red; margin-top:10px;"></div>
                <div id="registerSuccess" class="success-message" style="display:none; color:green; margin-top:10px;"></div>
            </form>
            <p style="text-align:center; margin-top:16px;">
                Already have an account? <a href="index.html">Login</a>
            </p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
