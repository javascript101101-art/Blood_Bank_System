services:
  - type: postgres
    name: blood-global-db
    plan: free
    region: singapore
    databaseName: blood_global
    user: blood_user

  - type: postgres
    name: blood-local-hospital-a-db
    plan: free
    region: singapore
    databaseName: blood_local_hospital_a
    user: blood_user

  - type: web
    name: blood-global-server
    runtime: python
    plan: free
    region: singapore
    buildCommand: |
      cd backend_global
      pip install -r requirements.txt
    startCommand: |
      cd backend_global
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVER_MODE
        value: global
      - key: GLOBAL_DATABASE_URL
        fromDatabase:
          name: blood-global-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
    healthCheckPath: /health

  - type: web
    name: blood-local-hospital-a
    runtime: python
    plan: free
    region: singapore
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVER_MODE
        value: local
      - key: LOCAL_DATABASE_URL
        fromDatabase:
          name: blood-local-hospital-a-db
          property: connectionString
      - key: GLOBAL_SERVER_URL
        value: https://blood-global-server.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
    healthCheckPath: /health

  - type: static
    name: blood-hospital-a-frontend
    publishDir: frontend/hospital_a
    buildCommand: echo "No build needed"

  - type: static
    name: blood-global-admin-frontend
    publishDir: frontend/global_admin
    buildCommand: echo "No build needed"