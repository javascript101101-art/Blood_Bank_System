# ============================================
# Render Blueprint for Blood Bank System
# ============================================

databases:
  # ============================================
  # 1. Global Database (PostgreSQL)
  # ============================================
  - name: blood-global-db
    plan: free
    region: singapore
    databaseName: blood_global
    user: blood_user

  # ============================================
  # 2. Local Database (Hospital A - PostgreSQL)
  # ============================================
  - name: blood-local-hospital-a-db
    plan: free
    region: singapore
    databaseName: blood_local_hospital_a
    user: blood_user

services:
  # ============================================
  # 3. Global Server (Backend)
  # ============================================
  - type: web
    name: blood-global-server
    runtime: python
    plan: free
    region: singapore
    buildCommand: |
      cd backend_global
      pip install -r requirements.txt
    startCommand: |
      cd backend_global
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVER_MODE
        value: global
      - key: GLOBAL_DATABASE_URL
        fromDatabase:
          name: blood-global-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
    healthCheckPath: /health

  # ============================================
  # 4. Local Server (Hospital A)
  # ============================================
  - type: web
    name: blood-local-hospital-a
    runtime: python
    plan: free
    region: singapore
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVER_MODE
        value: local
      - key: LOCAL_DATABASE_URL
        fromDatabase:
          name: blood-local-hospital-a-db
          property: connectionString
      - key: GLOBAL_SERVER_URL
        value: https://blood-global-server.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
    healthCheckPath: /health

  # ============================================
  # 5. Frontend - Hospital A (Static Site)
  # ============================================
  - type: static
    name: blood-hospital-a-frontend
    publishDir: frontend/hospital_a
    buildCommand: echo "No build needed"
    envVars:
      - key: API_BASE_URL
        value: https://blood-local-hospital-a.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ============================================
  # 6. Frontend - Global Admin (Static Site)
  # ============================================
  - type: static
    name: blood-global-admin-frontend
    publishDir: frontend/global_admin
    buildCommand: echo "No build needed"
    envVars:
      - key: API_BASE_URL
        value: https://blood-global-server.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html